name: "Feature Request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make Logica Context better? Describe it clearly u2014 concrete use cases help a lot.

  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve?"
      description: "Describe the context and why this matters. What are you trying to do that's currently difficult or impossible?"
      placeholder: "When working with large monorepos, I often need to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "What would you like to see? How should it work?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Have you tried workarounds? Why don't they fully solve the problem?"

  - type: textarea
    id: api
    attributes:
      label: "Proposed API / interface (optional)"
      description: "If you have a specific tool name, parameter shape, or CLI command in mind, describe it here"
      render: json

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which part of the system does this affect?"
      options:
        - Sandbox execution
        - Knowledge base / indexing
        - Search
        - URL fetching
        - Session / snapshots
        - Supabase integration
        - Claude Code hooks
        - CLI
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I searched existing issues and this hasn't been requested before"
          required: true
        - label: "I'm willing to submit a PR for this feature"
          required: false
