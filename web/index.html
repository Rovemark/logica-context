<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logica Context — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 2rem; }
    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1.5rem; }
    .card h3 { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .card .value { font-size: 2rem; font-weight: 700; color: #4ade80; }
    .card .unit { font-size: 0.85rem; color: #888; margin-left: 0.25rem; }
    .events { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1.5rem; }
    .events h2 { font-size: 1rem; margin-bottom: 1rem; }
    .event { display: flex; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid #222; font-size: 0.85rem; }
    .event .time { color: #666; min-width: 120px; }
    .event .tool { color: #60a5fa; min-width: 100px; }
    .event .summary { color: #ccc; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: #666; font-style: italic; }
    .refresh { background: #333; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin-bottom: 1rem; }
    .refresh:hover { background: #444; }
  </style>
</head>
<body>
  <h1>Logica Context</h1>
  <p class="subtitle">Context Window Protection Dashboard</p>
  <button class="refresh" onclick="loadData()">Refresh</button>

  <div class="grid">
    <div class="card">
      <h3>Knowledge Base Entries</h3>
      <div><span class="value" id="entries">-</span></div>
    </div>
    <div class="card">
      <h3>Unique Sources</h3>
      <div><span class="value" id="sources">-</span></div>
    </div>
    <div class="card">
      <h3>DB Size</h3>
      <div><span class="value" id="dbsize">-</span><span class="unit">KB</span></div>
    </div>
    <div class="card">
      <h3>Tokens Saved</h3>
      <div><span class="value" id="tokens">-</span></div>
    </div>
  </div>

  <div class="events">
    <h2>Recent Events</h2>
    <div id="eventList"><p class="empty">No events yet. Start using Logica Context tools.</p></div>
  </div>

  <script>
    // Dashboard reads from local SQLite via the CLI
    // In production, this would connect to the MCP server API
    function loadData() {
      document.getElementById('entries').textContent = '-';
      document.getElementById('sources').textContent = '-';
      document.getElementById('dbsize').textContent = '-';
      document.getElementById('tokens').textContent = '-';
      document.getElementById('eventList').innerHTML = '<p class="empty">Open a terminal and run: logica-context stats</p>';
    }
    loadData();
  </script>
</body>
</html>
